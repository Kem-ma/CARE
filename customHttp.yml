applications:
  - appRoot: frontend
    customHeaders:
      - pattern: '**'
        headers:
          - key: Strict-Transport-Security
            value: max-age=31536000; includeSubDomains
          - key: X-Content-Type-Options
            value: nosniff
          - key: X-Frame-Options
            value: DENY
          - key: Referrer-Policy
            value: no-referrer
          - key: Permissions-Policy
            value: geolocation=(self), microphone=(self), camera=()
          # Only this site's own scripts may run, which is what limits the damage of any injected
          # text. amazonaws.com covers the API, the alert socket, Cognito and the S3 uploads; once you
          # know your region you can narrow it to the exact hosts.
          - key: Content-Security-Policy
            value: "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data: blob: https://*.amazonaws.com; media-src 'self' blob: https://*.amazonaws.com; font-src 'self'; connect-src 'self' https://*.amazonaws.com wss://*.amazonaws.com; frame-ancestors 'none'; base-uri 'self'; form-action 'self'"
